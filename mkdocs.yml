site_name: KCommon
site_description: Documentation for building Minecraft plugins with KCommon
site_url: https://golfing7.github.io/KCommon/
repo_url: https://github.com/Golfing7/KCommon
repo_name: Golfing7/KCommon

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Prerequisites and dependency: getting-started/dependency.md
      - First plugin: getting-started/first-plugin.md
  - Building features:
      - Modules: features/modules.md
      - Configuration: features/configuration.md
      - Commands: features/commands.md
      - Menus: features/menus.md
      - Persistence: features/persistence.md
      - Placeholders: features/placeholders.md
      - Language and messages: features/language.md
  - Design patterns: development/patterns.md
  - Development workflow: development/workflow.md
